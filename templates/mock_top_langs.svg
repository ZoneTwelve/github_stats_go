<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Top Languages</title>
  <desc id="descId">Programming languages used by the user</desc>

  <defs>
    <!-- Background gradient matching GitHub stats card -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161b22;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Card Background -->
  <rect width="500" height="300" rx="10" fill="url(#bgGradient)" filter="url(#shadow)"/>

  <!-- Border -->
  <rect x="1" y="1" width="498" height="298" rx="9" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Header Section -->
  <g transform="translate(25, 25)">
    <!-- Icon Circle -->
    <circle cx="20" cy="20" r="20" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
    <text x="20" y="28" text-anchor="middle" fill="#58a6ff" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700">ZT</text>

    <!-- User Info -->
    <text x="50" y="20" fill="#c9d1d9" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700">@ZoneTwelve</text>
    <text x="50" y="37" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="13">Top Languages</text>
  </g>

  <!-- Divider Line -->
  <line x1="25" y1="80" x2="475" y2="80" stroke="#30363d" stroke-width="1"/>

  <!-- Languages Section -->
  <g transform="translate(25, 105)">
    <!-- JavaScript -->
    <g>
      <circle cx="8" cy="8" r="6" fill="#f1e05a"/>
      <text x="20" y="12" fill="#c9d1d9" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500">JavaScript</text>
      <text x="420" y="12" text-anchor="end" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="12">18.7%</text>

      <rect x="0" y="20" width="450" height="8" rx="4" fill="#21262d"/>
      <rect x="0" y="20" width="84" height="8" rx="4" fill="#f1e05a"/>
    </g>

    <!-- Python -->
    <g transform="translate(0, 45)">
      <circle cx="8" cy="8" r="6" fill="#3572A5"/>
      <text x="20" y="12" fill="#c9d1d9" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500">Python</text>
      <text x="420" y="12" text-anchor="end" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="12">5.1%</text>

      <rect x="0" y="20" width="450" height="8" rx="4" fill="#21262d"/>
      <rect x="0" y="20" width="23" height="8" rx="4" fill="#3572A5"/>
    </g>

    <!-- HTML -->
    <g transform="translate(0, 90)">
      <circle cx="8" cy="8" r="6" fill="#e34c26"/>
      <text x="20" y="12" fill="#c9d1d9" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500">HTML</text>
      <text x="420" y="12" text-anchor="end" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="12">10.6%</text>

      <rect x="0" y="20" width="450" height="8" rx="4" fill="#21262d"/>
      <rect x="0" y="20" width="48" height="8" rx="4" fill="#e34c26"/>
    </g>

    <!-- Dockerfile -->
    <g transform="translate(0, 135)">
      <circle cx="8" cy="8" r="6" fill="#58a6ff"/>
      <text x="20" y="12" fill="#c9d1d9" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="500">Dockerfile</text>
      <text x="420" y="12" text-anchor="end" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="12">0.1%</text>

      <rect x="0" y="20" width="450" height="8" rx="4" fill="#21262d"/>
      <rect x="0" y="20" width="0.5" height="8" rx="4" fill="#58a6ff"/>
    </g>
  </g>

  <!-- Footer -->
  <text x="25" y="285" fill="#484f58" font-family="'Segoe UI', Arial, sans-serif" font-size="9">Generated on Jan 18, 2026</text>
</svg>

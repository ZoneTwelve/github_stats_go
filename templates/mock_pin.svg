      <text x="35" y="38" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="11">AI-powered news credibility analyzer</text>
      <use href="#starIcon" width="14" height="14" x="410" y="17"/>
      <text x="428" y="27" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="11">8</text>

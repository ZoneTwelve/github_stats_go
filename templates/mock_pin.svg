<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="460" viewBox="0 0 500 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">Top Repositories</title>
  <desc id="descId">User's most starred repositories</desc>

  <defs>

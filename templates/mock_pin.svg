      <use href="#repoIcon" width="16" height="16" x="12" y="16"/>
      <text x="35" y="24" fill="#58a6ff" font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600">deepseek-ocr-general-modelling</text>
      <text x="35" y="38" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="11">OCR model training framework</text>
      <use href="#starIcon" width="14" height="14" x="410" y="17"/>
      <text x="428" y="27" fill="#8b949e" font-family="'Segoe UI', Arial, sans-serif" font-size="11">3</text>
    </g>


<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="300" viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="titleId descId">
  <title id="titleId">GitHub Statistics</title>
  <desc id="descId">Personal GitHub statistics including repositories, followers, contributions and achievements</desc>

  <defs>
    <!-- Clean gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:{{.BGColor}};stop-opacity:1" />
      <stop offset="100%" style="stop-color:{{.CardBg}};stop-opacity:1" />
    </linearGradient>

    <!-- Accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:{{.AccentColor}};stop-opacity:1" />
      <stop offset="100%" style="stop-color:{{.ProgressBg}};stop-opacity:1" />
    </linearGradient>

    <!-- Soft shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="{{.ShadowColor}}" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main Card Background -->
  <rect width="500" height="300" rx="10" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Border -->
  <rect x="1" y="1" width="498" height="298" rx="9" fill="none" stroke="{{.BorderColor}}" stroke-width="1"/>

  <!-- Header Section -->
  <g transform="translate(25, 25)">
    <!-- Profile Icon Circle -->
    <circle cx="20" cy="20" r="20" fill="{{.RankBg}}" stroke="{{.AccentColor}}" stroke-width="2"/>
    <text x="20" y="28" text-anchor="middle" fill="{{.AccentColor}}" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700">{{slice .Username 0 1}}</text>
    
    <!-- User Info -->
    <text x="50" y="20" fill="{{.TitleColor}}" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700">{{.Name}}</text>
    <text x="50" y="37" fill="{{.SubtitleColor}}" font-family="'Segoe UI', Arial, sans-serif" font-size="13">@{{.Username}}</text>
  </g>

  <!-- Divider Line -->
  <line x1="25" y1="80" x2="475" y2="80" stroke="{{.BorderColor}}" stroke-width="1"/>

  <!-- Statistics Grid -->
  <g transform="translate(25, 110)">
    <!-- Repositories -->
    <g>
      <rect width="100" height="65" rx="6" fill="{{.RankBg}}" opacity="0.6"/>
      <text x="50" y="28" text-anchor="middle" fill="{{.AccentColor}}" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800">{{.PublicRepos}}</text>
      <text x="50" y="48" text-anchor="middle" fill="{{.SecondaryText}}" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500">Repositories</text>
    </g>

    <!-- Followers -->
    <g transform="translate(120, 0)">
      <rect width="100" height="65" rx="6" fill="{{.RankBg}}" opacity="0.6"/>
      <text x="50" y="28" text-anchor="middle" fill="{{.AccentColor}}" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800">{{.Followers}}</text>
      <text x="50" y="48" text-anchor="middle" fill="{{.SecondaryText}}" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500">Followers</text>
    </g>

    <!-- Following -->
    <g transform="translate(240, 0)">
      <rect width="100" height="65" rx="6" fill="{{.RankBg}}" opacity="0.6"/>
      <text x="50" y="28" text-anchor="middle" fill="{{.AccentColor}}" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800">{{.Following}}</text>
      <text x="50" y="48" text-anchor="middle" fill="{{.SecondaryText}}" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500">Following</text>
    </g>

    <!-- Stars -->
    <g transform="translate(360, 0)">
      <rect width="90" height="65" rx="6" fill="{{.RankBg}}" opacity="0.6"/>
      <text x="45" y="28" text-anchor="middle" fill="{{.StarColor}}" font-family="'Segoe UI', Arial, sans-serif" font-size="26" font-weight="800">{{.TotalStars}}</text>
      <text x="45" y="48" text-anchor="middle" fill="{{.SecondaryText}}" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500">Stars</text>
    </g>
  </g>

  <!-- Contributions Section -->
  <g transform="translate(25, 200)">
    <text x="0" y="0" fill="{{.TitleColor}}" font-family="'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600">Yearly Activity</text>
    
    <!-- Commits -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="140" height="6" rx="3" fill="{{.RankBg}}"/>
      <rect x="0" y="0" width="{{.CommitsProgressWidth}}" height="6" rx="3" fill="url(#accentGradient)"/>
      <text x="145" y="6" fill="{{.SecondaryText}}" font-family="'Segoe UI', Arial, sans-serif" font-size="11">{{.TotalCommits}} Commits</text>
    </g>

    <!-- Pull Requests -->
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="140" height="6" rx="3" fill="{{.RankBg}}"/>
      <rect x="0" y="0" width="{{.PRsProgressWidth}}" height="6" rx="3" fill="url(#accentGradient)"/>
      <text x="145" y="6" fill="{{.SecondaryText}}" font-family="'Segoe UI', Arial, sans-serif" font-size="11">{{.TotalPRs}} Pull Requests</text>
    </g>

    <!-- Issues -->
    <g transform="translate(0, 45)">
      <rect x="0" y="0" width="140" height="6" rx="3" fill="{{.RankBg}}"/>
      <rect x="0" y="0" width="{{.IssuesProgressWidth}}" height="6" rx="3" fill="url(#accentGradient)"/>
      <text x="145" y="6" fill="{{.SecondaryText}}" font-family="'Segoe UI', Arial, sans-serif" font-size="11">{{.TotalIssues}} Issues</text>
    </g>
  </g>

  <!-- Rank Badge -->
  <g transform="translate(425, 25)">
    <circle cx="25" cy="25" r="24" fill="{{.RankBg}}" stroke="url(#accentGradient)" stroke-width="3"/>
    <text x="25" y="33" text-anchor="middle" fill="{{.AccentColor}}" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="900">{{.Rank}}</text>
  </g>

  <!-- Footer -->
  <text x="25" y="285" fill="{{.FooterColor}}" font-family="'Segoe UI', Arial, sans-serif" font-size="9">Generated on {{.GeneratedDate}}</text>
</svg>
